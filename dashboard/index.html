<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Engine Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>Marketing Engine</h1>
      <p class="muted">UK business leads across ten industries, cleaned with PySpark through bronze, silver and gold layers in PostgreSQL.</p>
    </div>
    <a class="api-link" href="/docs">API docs</a>
  </header>

  <main>
    <nav id="filters" class="filters" aria-label="Filter by industry"></nav>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="cards" class="grid" aria-live="polite"></section>
  </main>

  <template id="card-template">
    <article class="card">
      <h2></h2>
      <div class="chart"></div>
    </article>
  </template>
</body>
</html>
